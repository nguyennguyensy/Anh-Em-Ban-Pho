<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anh Em Bấn Phổ - Reader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Anh Em Bấn Phổ</h1>
      <p>English lesson reader</p>
    </div>
  </header>

  <main class="app-grid">
    <aside class="panel sidebar">
      <div class="panel-title">Folders</div>
      <div id="reader-tree" class="folder-tree"></div>
    </aside>

    <section class="panel content-panel">
      <div class="panel-title">Folder content</div>
      <div id="reader-folder-content" class="reader-folder-content">
        <div class="empty-state">Select a folder to view its files and subfolders.</div>
      </div>
    </section>
  </main>

  <template id="template-file-item">
    <div class="tree-item file-item" data-id="">
      <span class="item-icon">📄</span>
      <span class="item-name"></span>
    </div>
  </template>

  <script src="site-config.js"></script>
  <script src="content-store.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
