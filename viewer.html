<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Learning - Reader View</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>English Learning Reader</h1>
      <p>Xem nội dung bài học</p>
    </div>
    <a class="secondary-button" href="index.html">Quay về Reader</a>
  </header>

  <main class="app-grid">
    <aside class="panel sidebar">
      <div class="panel-title">Thư mục / File</div>
      <div id="viewer-tree" class="folder-tree"></div>
    </aside>
    <section class="panel content-panel">
      <div class="panel-title">Đang xem file</div>
      <div class="viewer-header">
        <h2 id="viewer-file-name">Không xác định</h2>
      </div>
      <div id="viewer-content" class="reader-content">
        <div class="empty-state">Không tìm thấy file. Vui lòng quay lại và chọn lại.</div>
      </div>
    </section>
  </main>

  <script src="site-config.js"></script>
  <script src="content-store.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
