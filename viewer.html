<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anh Em Bấn Phổ - Reader View</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Anh Em Bấn Phổ</h1>
      <p>Lesson reader</p>
    </div>
    <a class="secondary-button" href="index.html">Back to Reader</a>
  </header>

  <main class="app-grid">
    <aside class="panel sidebar">
      <div class="panel-title">Folders / Files</div>
      <div id="viewer-tree" class="folder-tree"></div>
    </aside>
    <section class="panel content-panel">
      <div class="panel-title">Current file</div>
      <div class="viewer-header">
        <h2 id="viewer-file-name">Unknown</h2>
      </div>
      <div id="viewer-content" class="reader-content">
        <div class="empty-state">File not found. Go back and choose another file.</div>
      </div>
    </section>
  </main>

  <script src="site-config.js"></script>
  <script src="content-store.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
