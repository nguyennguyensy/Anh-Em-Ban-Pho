<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anh Em Bấn Phổ - Editor File</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-modal">
      <h2>Editor Login</h2>
      <p>Enter the password to access the editor:</p>
      <input id="editor-password" type="password" placeholder="Password" autocomplete="off" />
      <button id="auth-submit" type="button" class="primary-button">Confirm</button>
      <div id="auth-message" class="auth-message"></div>
    </div>
  </div>

  <header class="app-header">
    <div>
      <h1>Anh Em Bấn Phổ Editor</h1>
      <p>Edit lesson files</p>
    </div>
    <a class="secondary-button" href="index.html">Back to Editor</a>
  </header>

  <main class="app-grid">
    <aside class="panel sidebar">
      <div class="panel-title">Folders / Files</div>
      <div id="editor-file-tree" class="folder-tree"></div>
    </aside>
    <section class="panel content-panel editor-panel">
      <div class="panel-title editor-bar">
        <div>
          <input id="file-name-input" class="file-name-input" placeholder="File name..." />
          <span id="file-status-label" class="status-tag">Draft</span>
        </div>
        <div class="editor-buttons">
          <button id="save-draft-btn" class="secondary-button">Save Draft</button>
          <button id="post-btn" class="primary-button">Post</button>
        </div>
      </div>

      <div id="editor-controls" class="editor-toolbar">
        <select id="font-family" aria-label="Font family">
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Comic Sans MS">Comic Sans MS</option>
        </select>
        <input id="font-size" type="number" min="10" max="64" value="16" title="Text size" />
        <button data-cmd="bold" class="toolbar-button">B</button>
        <button data-cmd="italic" class="toolbar-button">I</button>
        <button data-cmd="underline" class="toolbar-button">U</button>
        <button data-cmd="superscript" class="toolbar-button" title="Superscript">xⁿ</button>
        <button data-cmd="subscript" class="toolbar-button" title="Subscript">xₙ</button>
        <div class="color-picker-group">
          <button id="text-color-toggle" type="button" class="color-picker-button" title="Text color">A</button>
          <div id="text-color-palette" class="color-palette popover"></div>
        </div>
        <div class="color-picker-group">
          <button id="highlight-color-toggle" type="button" class="color-picker-button highlight" title="Highlight color">A</button>
          <div id="highlight-color-palette" class="color-palette popover"></div>
        </div>
        <button data-cmd="justifyLeft" class="toolbar-button">L</button>
        <button data-cmd="justifyCenter" class="toolbar-button">C</button>
        <button data-cmd="justifyRight" class="toolbar-button">R</button>
        <button data-cmd="justifyFull" class="toolbar-button">J</button>
        <input id="line-height" type="number" min="1" max="3" step="0.1" value="1.5" title="Line height" />
        <button id="insert-image-btn" class="secondary-button">Add picture</button>
        <button id="insert-sound-btn" class="secondary-button">Add sound</button>
        <button id="insert-blank-btn" class="secondary-button">Blank field</button>
        <button id="insert-mcq-btn" class="secondary-button">Multiple choice</button>
      </div>

      <div id="editor-shell" class="editor-shell">
        <div id="editor-content" class="editor-content" contenteditable="true" spellcheck="false"></div>
      </div>

      <div class="editor-status-bar">
        <div id="editor-message">Enter content and save the draft. Post to make it visible in the reader.</div>
      </div>
    </section>
  </main>

  <input id="image-input" type="file" accept="image/*" hidden />
  <input id="audio-input" type="file" accept="audio/*" hidden />
  <script src="../site-config.js"></script>
  <script src="../content-store.js"></script>
  <script src="file.js"></script>
</body>
</html>
