<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anh Em Bấn Phổ - Editor</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-modal">
      <h2>Editor Login</h2>
      <p>Enter the password to access the editor:</p>
      <input id="editor-password" type="password" placeholder="Password" autocomplete="off" />
      <button id="auth-submit" type="button" class="primary-button">Confirm</button>
      <div id="auth-message" class="auth-message"></div>
    </div>
  </div>

  <header class="app-header">
    <div>
      <h1>Anh Em Bấn Phổ Editor</h1>
      <p>Manage folders, content, and lessons.</p>
    </div>
    <a class="secondary-button" href="../index.html">Back to Reader</a>
  </header>

  <main class="app-grid">
    <aside class="panel sidebar">
      <div class="panel-title">Folders / Files</div>
      <div class="editor-actions">
        <button id="add-folder-btn" class="secondary-button">Add folder</button>
        <button id="add-file-btn" class="secondary-button">Add file</button>
      </div>
      <div id="editor-tree" class="folder-tree"></div>
    </aside>

    <section class="panel content-panel editor-panel">
      <div class="panel-title editor-bar">
        <div>
          <span id="current-folder-name">No folder selected</span>
        </div>
        <div class="editor-buttons">
          <button id="go-back-btn" class="secondary-button">Up one level</button>
        </div>
      </div>
      <div id="editor-folder-content" class="editor-folder-content">
        <div class="empty-state">Select a folder to view its files and subfolders.</div>
      </div>
      <div class="editor-status-bar">
        <div id="editor-message">The editor will ask for a GitHub token when you Save Draft or Post.</div>
      </div>
    </section>
  </main>

  <input id="image-input" type="file" accept="image/*" hidden />
  <input id="audio-input" type="file" accept="audio/*" hidden />
  <template id="template-folder-item">
    <div class="tree-item folder-item" data-id="">
      <span class="item-icon">📁</span>
      <span class="item-name"></span>
      <div class="folder-actions">
        <button class="tiny-button add-child">+</button>
        <button class="tiny-button delete-item">×</button>
      </div>
    </div>
  </template>
  <template id="template-file-item-editor">
    <div class="tree-item file-item" data-id="">
      <span class="item-icon">📄</span>
      <span class="item-name"></span>
      <button class="tiny-button delete-item">×</button>
    </div>
  </template>

  <script src="../site-config.js"></script>
  <script src="../content-store.js"></script>
  <script src="index.js"></script>
</body>
</html>
